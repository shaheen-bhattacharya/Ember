name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Test
        run: make test

  asan:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with AddressSanitizer
        run: make debug
      - name: Test under ASan
        run: ./tests/run_tests.sh

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Test
        run: make test
