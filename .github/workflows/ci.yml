name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Test
        run: make test
      - name: JIT selftest
        run: ./ember --jit-selftest
      - name: Test with JIT forced hot
        run: EMBER_JIT_THRESHOLD=1 ./tests/run_tests.sh
      - name: Test interpreter only
        run: EMBER_JIT=0 ./tests/run_tests.sh
      - name: Test under GC stress, JIT forced hot
        run: EMBER_GC_STRESS=1 EMBER_JIT_THRESHOLD=1 ./tests/run_tests.sh
      - name: Smoke-run samples
        run: ./samples/run_samples.sh

  asan:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with AddressSanitizer
        run: make debug
      - name: Test under ASan
        run: ./tests/run_tests.sh

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Test
        run: make test

  bench:
    # Informational: shared runners are noisy, so this reports numbers in the
    # log rather than gating the build.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Benchmarks (interpreter vs JIT)
        run: make bench
