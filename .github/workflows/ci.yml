name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Test
        run: make test
      - name: JIT selftest
        run: ./ember --jit-selftest
      - name: Test with JIT forced on
        run: EMBER_JIT=1 EMBER_JIT_THRESHOLD=1 ./tests/run_tests.sh

  asan:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with AddressSanitizer
        run: make debug
      - name: Test under ASan
        run: ./tests/run_tests.sh

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Test
        run: make test
